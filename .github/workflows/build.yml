name: Build  
  
on:  
  push:  
    branches: [ test ]  
  pull_request:  
    branches: [ test ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0  
  
      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          distribution: zulu  
          java-version: '17'  
          cache: gradle  
  
      - name: Grant execute permission for gradlew  
        run: chmod +x ./gradlew  
  
      - name: Build with Gradle  
        run: ./gradlew build --stacktrace -Dorg.gradle.java.installations.auto-download=false
  
      - name: Upload build artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: Trinity-Unofficial-jars  
          path: build/libs/*.jar  
          if-no-found-error: false  
          retention-days: 14